# fly.io deployment. One machine, one volume, never scaled to zero: the
# collector runs inside the web process and a stopped machine is a hole in a
# dataset that cannot be backfilled.
app = "padel-tracker-jaipur"
primary_region = "bom"   # Mumbai: closest region to the venues and to Hudle

[build]
  dockerfile = "Dockerfile"

[env]
  PADEL_TRACKER_CONFIG = "/app/config.yaml"
  PADEL_TRACKER_STORAGE_URL = "sqlite:////data/padel.db"

[mounts]
  source = "padel_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # a sleeping machine misses polls
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "60s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
