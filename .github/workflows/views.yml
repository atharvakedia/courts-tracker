name: views

# Rebuild the stored dashboard views after every merge to main, so a change to
# what a view holds is live within minutes instead of at the next daily pass.
# No Hudle requests: it reads only what the store already holds.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Shares the daily pass's group: the two never write views at the same time.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HUDLE_API_SECRET: ${{ secrets.HUDLE_API_SECRET }}
      HUDLE_APP_ID: ${{ secrets.HUDLE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -m tracker views --log-format console
