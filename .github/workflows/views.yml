name: views

# Rebuild the stored dashboard views after every merge to main, so a change to
# what a view holds is live within minutes instead of at the next daily pass.
# The dashboard also starts it when a block is saved, and running it by hand on
# a branch builds that branch's views for its preview.
# No Hudle requests: it reads only what the store already holds.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Its own group: GitHub keeps one waiting run per group and cancels an older
# one, so sharing the daily pass's group would let a block saved during a pass
# cancel the next pass.
concurrency:
  group: views
  cancel-in-progress: false

jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HUDLE_API_SECRET: ${{ secrets.HUDLE_API_SECRET }}
      HUDLE_APP_ID: ${{ secrets.HUDLE_APP_ID }}
      SLOT_MIRROR: data/mirror.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      # The mirror of the slots from the last build, so this one reads only
      # what changed since (see tracker.views). A miss rebuilds it whole.
      - name: Restore the slot mirror
        uses: actions/cache/restore@v4
        with:
          path: data/mirror.db
          key: slot-mirror-${{ github.run_id }}
          restore-keys: slot-mirror-
      - run: python -m tracker views --log-format console
      - name: Save the slot mirror
        if: always() && hashFiles('data/mirror.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/mirror.db
          key: slot-mirror-${{ github.run_id }}
