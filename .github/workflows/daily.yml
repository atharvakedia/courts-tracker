name: daily

# One pass a day for every tracked court: yesterday through two weeks ahead.
# 23:00 in Jaipur, so a venue that keeps no public history still yields a
# played day. Sundays also refresh the pickleball court list first.
on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      discover:
        description: "Refresh the pickleball court list first"
        type: boolean
        default: false

# Two passes at once would double the traffic to Hudle.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HUDLE_API_SECRET: ${{ secrets.HUDLE_API_SECRET }}
      HUDLE_APP_ID: ${{ secrets.HUDLE_APP_ID }}
      SLOT_MIRROR: data/mirror.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      # The mirror of the slots from the last build, so this one reads only
      # what changed since (see tracker.views). A miss rebuilds it whole.
      - name: Restore the slot mirror
        uses: actions/cache/restore@v4
        with:
          path: data/mirror.db
          key: slot-mirror-${{ github.run_id }}
          restore-keys: slot-mirror-
      - name: Daily pass
        run: |
          flags=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Kolkata date +%u)" = "7" ]; then flags="--discover"; fi
          if [ "${{ inputs.discover }}" = "true" ]; then flags="--discover"; fi
          python -m tracker daily $flags --log-format console
      - name: Save the slot mirror
        if: always() && hashFiles('data/mirror.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/mirror.db
          key: slot-mirror-${{ github.run_id }}
