[project]
name = "padel-tracker"
version = "0.1.0"
description = "Court-occupancy tracking for Jaipur padel venues listed on Hudle"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "apscheduler>=3.10",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7", "mypy>=1.13", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["live: hits the real Hudle API; deselected by default"]
addopts = "-m 'not live' -q"
testpaths = ["tests"]
