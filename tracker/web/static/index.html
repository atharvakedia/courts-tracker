<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jaipur padel — court occupancy</title>
    <meta
      name="description"
      content="Court occupancy, lead time and pricing for the three padel venues in Jaipur listed on Hudle. Every number carries its denominator."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Runs before the stylesheet so the page never paints the wrong theme first. -->
    <script>
      (function () {
        var mode = 'light';
        try {
          var saved = localStorage.getItem('padel.theme');
          if (saved === 'dark' || saved === 'light') {
            mode = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            mode = 'dark';
          }
        } catch (_) {
          /* private mode, blocked storage: fall through to the media query */
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark';
          } catch (_) {}
        }
        document.documentElement.dataset.theme = mode;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d6f62'/%3E%3Crect x='7' y='10' width='18' height='12' rx='1' fill='none' stroke='white' stroke-width='1.6'/%3E%3Cpath d='M16 9v14M7 16h18' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E"
    />

    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
  </head>

  <body class="app">
    <a class="visually-hidden skip" href="#stage">Skip to the charts</a>

    <!-- Row 1: identity, scope controls, collector health. One line, always visible. -->
    <header class="bar bar--top">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Jaipur padel</span>
      </div>

      <form class="ctl" id="filters" aria-label="Scope">
        <div class="segmented" id="window-group" role="group" aria-label="Window"></div>
        <label class="ctl__field">
          <span class="visually-hidden">Sport</span>
          <select id="sport-select" aria-label="Sport">
            <option value="padel">Padel</option>
            <option value="pickleball">Pickleball</option>
            <option value="all">Both</option>
          </select>
        </label>
        <label class="ctl__field">
          <span class="visually-hidden">Venue</span>
          <select id="venue-select" aria-label="Venue"><option value="">All venues</option></select>
        </label>
      </form>

      <div class="bar__right">
        <span class="pulse" id="pulse" data-state="loading">
          <span class="pulse__dot" aria-hidden="true"></span>
          <span id="pulse-text">Checking…</span>
        </span>
        <button class="iconbtn" id="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="iconbtn__glyph" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <!-- Row 2: the numbers that never change place, so the eye can anchor. -->
    <section class="kpibar" aria-label="Headline figures">
      <div class="kpibar__hero" id="hero">
        <div class="skel skel-line" id="hero-skeleton" style="height: 38px; width: 12rem"></div>
        <div id="hero-content" hidden></div>
      </div>
      <div class="kpibar__tiles" id="kpis"></div>
    </section>

    <div id="banners" class="bannerbar" role="status" aria-live="polite"></div>

    <!-- Row 3: the stage. Exactly one view is visible; it fills what is left. -->
    <nav class="viewtabs" id="viewtabs" aria-label="View">
      <button type="button" data-view="now" aria-pressed="true">Now</button>
      <button type="button" data-view="demand" aria-pressed="false">Demand</button>
      <button type="button" data-view="timing" aria-pressed="false">Timing</button>
      <button type="button" data-view="market" aria-pressed="false">Market</button>
      <button type="button" data-view="record" aria-pressed="false">Record</button>
    </nav>

    <main class="stage" id="stage">
      <!-- Now: the three things that are true today -- what sold, what was
           withdrawn, and whether the collector is actually watching. -->
      <div class="view view--now" data-view="now">
        <section class="panel" id="panel-occupancy" aria-labelledby="t-occupancy"></section>
        <section class="panel" id="panel-blocked" aria-labelledby="t-blocked"></section>
        <section class="panel" id="panel-leadtime" aria-labelledby="t-leadtime"></section>
      </div>

      <div class="view view--2" data-view="demand" hidden>
        <section class="panel" id="panel-heatmap" aria-labelledby="t-heatmap"></section>
        <section class="panel" id="panel-weekday" aria-labelledby="t-weekday"></section>
      </div>

      <div class="view view--2" data-view="timing" hidden>
        <section class="panel" id="panel-sellout" aria-labelledby="t-sellout"></section>
        <section class="panel" id="panel-firstslot" aria-labelledby="t-firstslot"></section>
      </div>

      <div class="view view--4" data-view="market" hidden>
        <section class="panel" id="panel-share" aria-labelledby="t-share"></section>
        <section class="panel" id="panel-revenue" aria-labelledby="t-revenue"></section>
        <section class="panel" id="panel-pricing" aria-labelledby="t-pricing"></section>
        <section class="panel" id="panel-byhour" aria-labelledby="t-byhour"></section>
      </div>

      <div class="view view--4" data-view="record" hidden>
        <section class="panel" id="panel-coverage" aria-labelledby="t-coverage"></section>
        <section class="panel" id="panel-cancellations" aria-labelledby="t-cancellations"></section>
        <section class="panel" id="panel-venues" aria-labelledby="t-venues"></section>
        <section class="panel" id="panel-catalog" aria-labelledby="t-catalog"></section>
      </div>
    </main>

    <!-- Row 4: the standing caveats, compressed to one line so they cost no height. -->
    <footer class="bar bar--foot">
      <span class="foot__note"><b>Booked</b> beats <b>available</b>; elapsed slots stay available upstream, so pastness is tracked separately.</span>
      <span class="foot__note" id="colophon-generated"></span>
      <p class="foot__note" id="filters-note"></p>
    </footer>

    <script type="module" src="js/main.js"></script>
    <noscript>
      <div class="banner" data-tone="warn">
        This dashboard draws in the browser. The same numbers are at
        <a href="/api/metrics/catalog">/api/metrics/catalog</a>.
      </div>
    </noscript>
  </body>
</html>
